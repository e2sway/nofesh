name: Nofesh
options:
  bundleIdPrefix: com.nofesh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: NO

targets:
  Nofesh:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Support/Info.plist
      properties:
        CFBundleDisplayName: Nofesh
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCalendarsFullAccessUsageDescription: "Nofesh finds the free gaps in your day so it can suggest 2-minute reset breaks around your meetings."
        NSCalendarsWriteOnlyAccessUsageDescription: "Send 2-minute reset breaks straight into your calendar so they actually happen."
        NSUserNotificationsUsageDescription: "Nofesh reminds you to take a 2-minute reset when a free slot arrives."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nofesh.app
        INFOPLIST_FILE: Sources/Support/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        COPY_PHASE_STRIP: YES
    postCompileScripts:
      - name: Strip iCloud extended attributes before signing
        script: |
          xattr -cr "${TARGET_BUILD_DIR}/${FULL_PRODUCT_NAME}" 2>/dev/null || true
          xattr -cr "${TARGET_BUILD_DIR}/${FULL_PRODUCT_NAME}.dSYM" 2>/dev/null || true
          exit 0